<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Administrador</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#17262d;--mut:#5b6b73;--bd:#d3dce1;--ac:#0b5c6b;--acx:#fff;--acbg:#dcedf0;--sg:#f8fafb;--wn:#8a5a00;--wnbg:#fdefd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b1f;--card:#1b282e;--tx:#e8eff2;--mut:#9fb1b9;--bd:#33454d;--ac:#6cc5d4;--acx:#0d1a1e;--acbg:#173a42;--sg:#162227;--wn:#f3cf85;--wnbg:#3d2f10}}
:root[data-theme="dark"]{--bg:#121b1f;--card:#1b282e;--tx:#e8eff2;--mut:#9fb1b9;--bd:#33454d;--ac:#6cc5d4;--acx:#0d1a1e;--acbg:#173a42;--sg:#162227;--wn:#f3cf85;--wnbg:#3d2f10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px;font-weight:600}h2{font-size:16px;margin:0;font-weight:600;color:var(--ac)}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:230px;flex:0 0 230px;background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.side h1{margin:0}.side .sub{margin:0 0 8px}
.app main{flex:1;min-width:0;max-width:none;margin:0;padding:16px 20px 40px}
.tabs{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.tabs .chip{width:100%;text-align:left;border-color:transparent;background:none}
.tabs .chip[aria-pressed="true"]{background:var(--acbg);border:1px solid var(--ac);padding:8px 16px}
.gt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:12px 6px 2px}
#ttl{font-size:22px;margin:0 0 12px;color:var(--tx)}
.menu{display:none}
@media(max-width:800px){.app{display:block}.side{position:fixed;top:0;bottom:0;left:0;height:auto;z-index:20;width:260px;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}body.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}.menu{display:inline-block;margin-bottom:10px}.app main{padding:12px 12px 40px}}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 16px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{border:2px solid var(--ac);padding:7px 15px;font-weight:600}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.k small{display:block;color:var(--mut);font-size:13px}.k strong{font-size:22px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card .kp{margin-top:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:13px}td.n,th.n{text-align:right}
.badge{font-size:12px;border-radius:10px;padding:2px 10px;background:var(--acbg);color:var(--ac)}.badge.w{background:var(--wnbg);color:var(--wn)}
label{display:block;font-size:13px;color:var(--mut)}
input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.vcard{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);cursor:pointer}
.fr input,.fr select,input[type=date]{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.mi{width:80px;font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
@media print{.side,.menu,button,.fr,.sub{display:none!important}.app{display:block}}
</style></head><body><div class="app"><aside class="side"><h1>Administrador</h1><p class="sub" id="sub">Conectando…</p><nav class="tabs" id="tabs"></nav><button class="ghost" id="rst">Borrar datos de la demo</button></aside><main><button class="ghost menu" id="mn" aria-label="Abrir menú">☰ Menú</button><h2 id="ttl"></h2><div id="v"></div></main></div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>"$"+Number(n||0).toLocaleString("es-CO");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=d=>d?new Date(d+"T12:00:00").toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"}):"—";
const ft=t=>new Date(t).toLocaleString("es-CO",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
let PR=[],JR=[],VL=[],FA=[],ZN={},BQ={},sem="",pct=22,fm="",AS=[],dSal="",sV="",sP="",ALL=[],EL=[],INVT=[],vsel="",C=[],M=[],N=[],ed=null,tab="main",flt="todos";
const TABS=[["main","Principal"],["ventas","Ventas"],["vend","Vendedores"],["cob","Cobradores"],["nequi","Nequi"],["inv","Inventario"],["salida","Salida del día"],["semanal","Cobro semanal"],["prest","Préstamos"],["zonas","Zonas y jornada"],["rend","Rendimiento"],["dev","Devoluciones"],["cli","Mudanzas"],["mora","Mora"],["caja","Caja"]];
const sum=(l,f)=>l.reduce((s,a)=>s+f(a),0);
const saldo=a=>a.h.length?a.h[a.h.length-1].s:a.total;
const cobrado=a=>sum(a.h.filter(r=>!r.ini),r=>r.m);
const cont=a=>a.tipo==="contado";
const td=(v,n)=>`<td${n?' class="n"':""}>${v}</td>`;
const kpi=(l,v)=>`<div class="k"><small>${l}</small><strong>${v}</strong></div>`;
const tbl=(h,rows)=>rows.length?`<div class="tw"><table><thead><tr>${h.map(x=>`<th${x[1]?' class="n"':""}>${x[0]}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`:`<div class="sub" style="margin:0">Sin registros todavía.</div>`;
const vacio=`<div class="card"><div class="sub" style="margin:0">Aún no hay ventas. Registra una en el formulario del vendedor y aparecerá aquí.</div></div>`;
const tipoB=a=>cont(a)?`<span class="badge">Contado</span>`:`<span class="badge w">Crédito</span>`;
const by=(l,k)=>{const o={};l.forEach(a=>{const n=a[k]||"Sin asignar";(o[n]=o[n]||[]).push(a)});return o};

function vMain(){
  const cr=C.filter(a=>!cont(a));
  const m=M.filter(x=>(flt==="todos"||x.rol===flt)&&(!fm||new Date(x.t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)===fm)).slice().reverse();
  const T={venta:"Venta a crédito",contado:"Venta de contado",cobro:"Cobro",eliminada:"Venta eliminada",editada:"Venta editada",inventario:"Inventario",jornada:"Jornada",entrega:"Entrega",mudanza:"Mudanza"};
  return `<div class="kp">${kpi("Vendido en total",fmt(sum(C,a=>a.total)))}${kpi("Ventas de contado",fmt(sum(C.filter(cont),a=>a.total)))}${kpi("Recaudado por cobradores",fmt(sum(cr,cobrado)))}${kpi("Saldo por cobrar",fmt(sum(cr,saldo)))}</div>
  <div class="card"><div class="hd"><h2>Historial de movimientos</h2><select id="flt" aria-label="Filtrar movimientos"><option value="todos">Todos</option><option value="vendedor">Solo vendedores</option><option value="cobrador">Solo cobradores</option><option value="inventario">Solo inventario</option></select><input type="date" id="fm" value="${fm}" aria-label="Ver movimientos de una fecha" style="width:auto"><button class="ghost" id="fmx">Todas las fechas</button></div>
  ${tbl([["Fecha y hora"],["Quién"],["Rol"],["Movimiento"],["Factura"],["Cliente"],["Monto",1],["Detalle"]],m.map(x=>`<tr>${td(ft(x.t))}${td(esc(x.quien))}${td({vendedor:"Vendedor",cobrador:"Cobrador",administrador:"Administrador",inventario:"Inventario"}[x.rol]||x.rol)}${td(T[x.tipo]||x.tipo)}${td(esc(x.inv))}${td(esc(x.cliente))}${td(["inventario","jornada","entrega","mudanza"].includes(x.tipo)?"—":fmt(x.monto),1)}${td(esc(x.det))}</tr>`))}</div>`;
}
const H={"Content-Type":"application/json"};
const hh=t=>new Date(t).toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
const hoy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const prox=a=>a.h.length?a.h[a.h.length-1].p:a.first;
const fv=a=>a.fecha||(a.h[0]&&a.h[0].f)||"";
function wk(){const d=new Date(hoy()+"T12:00:00");d.setDate(d.getDate()-(d.getDay()+1)%7);return d.toISOString().slice(0,10)}
const delB=a=>`<button class="ghost" data-ed="${esc(a.inv)}">Editar</button> <button class="ghost" data-del="${esc(a.inv)}">Eliminar</button>`;
function vVentas(){
  const e=C.find(a=>a.inv===ed),form=e?`<div class="card"><h2>Editar ${esc(e.inv)} · ${esc(e.n)}</h2><div class="fr">${(e.items||[e.prod]).length>1?`<div><label>Productos de la venta</label><div class="sub" style="margin:0">${esc(e.prod)}</div></div>`:`<div><label for="eP">Producto</label><select id="eP">${INVT.map(p=>`<option${p.nombre===e.prod?" selected":""}>${esc(p.nombre)}</option>`).join("")}${INVT.some(p=>p.nombre===e.prod)?"":`<option selected>${esc(e.prod)}</option>`}</select></div>`}<div><label for="eT">Valor total</label><input id="eT" type="number" value="${e.total}"></div>${cont(e)?"":`<div><label for="eQ">Valor a cobrar</label><input id="eQ" type="number" value="${e.cuota}"></div><div><label for="eC">Cobrador</label><select id="eC">${COBS.map(c=>`<option${c===e.cob?" selected":""}>${c}</option>`).join("")}</select></div>`}</div><div style="margin-top:10px"><button class="ghost" id="eOk">Guardar cambios</button> <button class="ghost" id="eNo">Cancelar</button></div></div>`:"";
  const el=EL.length?`<div class="card"><h2>Ventas eliminadas</h2>${tbl([["Factura"],["Cliente"],["Producto"],["Vendedor"],["Total",1],["Eliminada"]],EL.map(a=>`<tr>${td(esc(a.inv))}${td(esc(a.n))}${td(esc(a.prod))}${td(esc(a.vend||"—"))}${td(fmt(a.total),1)}${td(ft(a.anuladaT))}</tr>`))}</div>`:"";
  if(!C.length)return form+vacio+el;
  return form+`<div class="card"><h2>Todas las ventas</h2>${tbl([["Factura"],["Fecha"],["Cliente"],["Producto"],["Tipo"],["Vendedor"],["Cobrador"],["Total",1],["Pagado",1],["Saldo",1],["Acción"]],C.slice().reverse().map(a=>`<tr>${td(esc(a.inv))}${td(fd(fv(a)))}${td(esc(a.n))}${td(esc(a.prod))}${td(tipoB(a))}${td(esc(a.vend||"—"))}${td(esc(a.cob||"—"))}${td(fmt(a.total),1)}${td(fmt(a.total-saldo(a)),1)}${td(fmt(saldo(a)),1)}${td(delB(a))}</tr>`))}</div>`+el;
}
function vVend(){
  if(!C.length)return vacio;
  const g=by(C,"vend");
  if(vsel&&g[vsel])return perfil(vsel,g[vsel]);
  vsel="";
  return `<div class="sub">Toca un vendedor para ver su perfil y el detalle de sus ventas.</div>`+Object.keys(g).map(n=>{const l=g[n];return `<button class="card vcard" data-v="${esc(n)}"><h2>${esc(n)}</h2><div class="kp">${kpi("Ventas",l.length)}${kpi("Total vendido",fmt(sum(l,a=>a.total)))}${kpi("Le deben",fmt(sum(l,saldo)))}</div></button>`}).join("");
}
function perfil(n,l){
  const t=hoy(),w=wk(),m=t.slice(0,7),S=f=>fmt(sum(l.filter(a=>f(fv(a))),a=>a.total));
  const pen=l.filter(a=>!cont(a)&&saldo(a)>0).sort((x,y)=>prox(x)<prox(y)?-1:1),meses={};
  l.forEach(a=>{const k=fv(a).slice(0,7);meses[k]=(meses[k]||0)+a.total});
  return `<button class="ghost" id="vback">← Vendedores</button><h2 style="margin:12px 0">${esc(n)}</h2>
  <div class="kp">${kpi("Hoy",S(d=>d===t))}${kpi("Esta semana",S(d=>d>=w))}${kpi("Este mes",S(d=>d.slice(0,7)===m))}${kpi("Total vendido",fmt(sum(l,a=>a.total)))}${kpi("Le deben",fmt(sum(l,saldo)))}</div>
  <div class="card"><h2>Cobros pendientes</h2>${tbl([["Factura"],["Cliente"],["Saldo",1],["Próxima visita"],["Cobrador"]],pen.map(a=>`<tr>${td(esc(a.inv))}${td(esc(a.n))}${td(fmt(saldo(a)),1)}${td(fd(prox(a))+(prox(a)<hoy()?' <span class="badge w">Atrasada</span>':""))}${td(esc(a.cob))}</tr>`))}</div>
  <div class="card"><h2>Por mes</h2>${tbl([["Mes"],["Vendido",1]],Object.keys(meses).sort().reverse().map(k=>`<tr>${td(k?new Date(k+"-15T12:00:00").toLocaleDateString("es-CO",{month:"long",year:"numeric"}):"Sin fecha")}${td(fmt(meses[k]),1)}</tr>`))}</div>
  <div class="card"><h2>Detalle de ventas</h2>${tbl([["Factura"],["Fecha"],["Cliente"],["Teléfono"],["Dirección"],["Producto"],["Tipo"],["Total",1],["Pagado",1],["Saldo",1],["Próx. visita"],["Cobrador"],["Acción"]],l.slice().reverse().map(a=>`<tr>${td(esc(a.inv))}${td(fd(fv(a)))}${td(esc(a.n))}${td(esc(a.tel))}${td(a.dir?esc(a.dir)+", "+esc(a.c):"—")}${td(esc(a.prod))}${td(tipoB(a))}${td(fmt(a.total),1)}${td(fmt(a.total-saldo(a)),1)}${td(fmt(saldo(a)),1)}${td(!cont(a)&&saldo(a)?fd(prox(a)):"—")}${td(esc(a.cob||"—"))}${td(delB(a))}</tr>`))}</div>`;
}
function vInv(){
  const nv=n=>sum(C,a=>(a.items||[a.prod]).filter(x=>x===n).length);
  return `<div class="card"><h2>Agregar producto</h2><div class="fr"><div><label for="pN">Nombre</label><input id="pN"></div><div><label for="pS">Cantidad</label><input id="pS" type="number" inputmode="numeric" min="0"></div><button class="ghost" id="pAdd">Agregar</button></div></div>
  <div class="kp">${kpi("Productos",INVT.length)}${kpi("Unidades en stock",sum(INVT,p=>p.stock))}</div>
  <div class="card"><h2>Inventario</h2>${tbl([["Producto"],["En stock",1],["Vendidas",1],["Precio contado",1],["Precio crédito",1],["Acción"]],INVT.map(p=>`<tr>${td(esc(p.nombre))}${td(p.stock>0?p.stock:'<span class="badge w">Agotado</span>',1)}${td(nv(p.nombre),1)}${td(p.pc?fmt(p.pc):"—",1)}${td(p.pr?fmt(p.pr):"—",1)}${td(`<button class="ghost" data-pe="${esc(p.id)}">Stock</button> <button class="ghost" data-pp="${esc(p.id)}">Precios</button>`)}</tr>`))}</div>`;
}
const VENDS=["Andrés Gómez"];
function vSalida(){
  const vs=[...new Set([...VL,...C.map(a=>a.vend).filter(Boolean),...AS.map(x=>x.vend)])];
  if(!vs.includes(sV))sV=vs[0];
  if(!INVT.some(p=>p.nombre===sP))sP=(INVT[0]||{}).nombre||"";
  const g=by(AS,"vend");
  const acc=x=>`<button class="ghost" data-sa="e" data-sv="${esc(x.vend)}" data-sp="${esc(x.prod)}">Editar</button> <button class="ghost" data-sa="q" data-sv="${esc(x.vend)}" data-sp="${esc(x.prod)}">Quitar</button>`;
  return `<div class="card"><div class="hd"><h2>Productos que salen a vender</h2><input type="date" id="ds" value="${dSal}" aria-label="Fecha de salida" style="width:auto"></div>
  <p class="sub">Al asignar, las unidades salen del inventario; si quitas o reduces, vuelven. Lo que venda el vendedor sale de lo asignado.</p>
  <div class="fr"><div><label for="sVn">Vendedor</label><select id="sVn">${vs.map(v=>`<option${v===sV?" selected":""}>${esc(v)}</option>`).join("")}</select></div>
  <div><label for="sPn">Producto</label><select id="sPn">${INVT.map(p=>`<option value="${esc(p.nombre)}"${p.nombre===sP?" selected":""}>${esc(p.nombre)} (${p.stock} en stock)</option>`).join("")}</select></div>
  <div><label for="sQ">Cantidad a sumar</label><input id="sQ" type="number" inputmode="numeric" min="1" value="1"></div>
  <button class="ghost" id="sAdd">Asignar</button></div><div class="fr" style="margin-top:10px"><div><label for="nvN">Agregar vendedor/a</label><input id="nvN"></div><button class="ghost" id="nvB">Agregar</button></div></div>`+
  (AS.length?Object.keys(g).map(n=>{const l=g[n];return `<div class="card"><div class="hd"><h2>${esc(n)} · ${fd(dSal)}${l[0].cerrado?' <span class="badge">Día cerrado</span>':""}</h2>${l[0].cerrado?"":`<button class="ghost" data-cz="${esc(n)}">Cerrar día</button>`}</div><div class="kp">${kpi("Unidades que lleva",sum(l,x=>x.cant))}${kpi("Vendidas",sum(l,x=>x.vendidas))}${kpi("Le quedan",sum(l,x=>Math.max(x.cant-x.vendidas,0)))}</div>
  ${tbl([["Producto"],["Lleva",1],["Vendidas",1],["Le quedan",1],["Acción"]],l.map(x=>`<tr>${td(esc(x.prod))}${td(x.cant,1)}${td(x.vendidas,1)}${td(Math.max(x.cant-x.vendidas,0),1)}${td(acc(x))}</tr>`))}</div>`}).join(""):`<div class="card"><div class="sub" style="margin:0">Aún no hay productos asignados para esta fecha. Elige vendedor, producto y cantidad.</div></div>`)+faltCard();
}
function faltCard(){return `<div class="card"><h2>Faltantes por devolver · días cerrados</h2>${tbl([["Fecha"],["Vendedor"],["Producto"],["Le falta",1],["Estado"],["Acción"]],FA.slice().reverse().map(x=>`<tr>${td(fd(x.fecha))}${td(esc(x.vend))}${td(esc(x.prod))}${td(x.cant,1)}${td(x.estado==="pendiente"?'<span class="badge w">Pendiente</span>':'<span class="badge">Recibido</span>')}${td(x.estado==="pendiente"?`<button class="ghost" data-fr="${esc(x.id)}">Recibido · volver al inventario</button>`:"—")}</tr>`))}</div>`}
const escala=v=>v>=5700000?23:v>=3700000?22:v>=3100000?21:v>=2600000?19:v>=2000000?17:0;
function semData(){const days=[0,1,2,3,4,5,6].map(i=>{const d=new Date(sem+"T12:00:00");d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});return COBS.map(c=>{const l=C.filter(a=>a.cob===c&&!cont(a));let ac=0;const r=days.map(f=>{let e=0,n=0;l.forEach(a=>a.h.forEach(x=>{if(!x.ini&&x.f===f){if(x.metodo==="nequi")n+=x.m;else e+=x.m}}));ac+=e+n;return{f,e,n,ac}}),ef=sum(r,x=>x.e),nq=sum(r,x=>x.n),rec=ef+nq,prog=rec+sum(l.filter(a=>saldo(a)>0&&prox(a)<=days[6]),a=>Math.min(a.cuota,saldo(a))),p=escala(rec);return{c,l,r,ef,nq,rec,prog,falta:Math.max(prog-rec,0),cum:prog?Math.round(rec/prog*100):0,p,car:sum(l,a=>a.total),pen:sum(l,saldo),gan:Math.round(rec*p/100)}})}
function vSemanal(){
  const D=semData();
